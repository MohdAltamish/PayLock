# Render Blueprint for Paylock (BUILD_PLAN Task 21, INSTRUCTIONS section 8).
# All services on free tier for testing. Free Postgres expires 30 days after
# creation; upgrade before then or follow the re-create procedure in INSTRUCTIONS 8.
#
# Free tier limitations:
# - No preDeployCommand: migrations must be run via build script
# - No initialDeployHook: seed runs via build script on every deploy
# - No shell access
# - Spins down after inactivity (cold starts)
#
# All commands run from the repo root so npm workspaces resolve. NODE_ENV is
# production at build time, so `npm ci` needs --include=dev (prisma, tsup,
# tsx, typescript and Next's types are devDependencies).
#
# Secrets use `sync: false`: Render asks for them when the Blueprint is first
# applied and never stores them in this file. E2E_FUNDING is deliberately
# absent (the test card route must never exist on Render).

databases:
  - name: paylock-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: paylock
    user: paylock

services:
  - type: web
    name: paylock-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Build includes migrations and seed for free tier (no preDeployCommand available)
    # Seed is idempotent (upserts), safe to run on every build
    buildCommand: npm ci --include=dev && npm run build -w apps/api && npm run db:deploy -w apps/api && npm run seed -w apps/api
    # Started from the repo root (not -w) so fixtures/replay resolves against the root.
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: paylock-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        value: "BAAbrGs0wmQezJC6FSXUv5PQKa8QbEuMYF7o4yOoNK-xobZxjfYgvoqpuj_2jWcl1BgbDzBMrNItwZFMR4"
      - key: PAYPAL_CLIENT_SECRET
        value: "ENO8jMoOlncKKNRD2mKpKtuJe4x_FA9XItfvdyMs4LMd4644t2peE5ZO8QA_gBFC_bqZf656A_5X68b9"
      - key: PAYPAL_WEBHOOK_ID
        value: "0YY564588V795923D"
      - key: PAYPAL_PLATFORM_EMAIL
        value: "admin@paylock.example.com"
      - key: PAYPAL_SANDBOX_SELLER_EMAIL
        value: "seller-paylock@personal.example.com"
      - key: AUTH_SAFE_WINDOW_HOURS
        value: "72"
      # Public origins. Change both if Render assigns different subdomains.
      - key: APP_URL
        value: https://paylock-web.onrender.com
      - key: API_URL
        value: https://paylock-api.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYLOCK_FREEZE
        value: "0"
      # Recorded fixtures (fixtures/replay); the hosted demo makes no live LLM calls.
      - key: AGENTS_MODE
        value: replay
      # off: a prompt with no fixture fails safe (rules-only risk, NEEDS_REVIEW).
      # live: falls back to the LLM, which spends the account-wide free daily quota.
      - key: LLM_REPLAY_FALLBACK
        value: "off"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash-preview-05-20
      - key: LLM_JSON_MODE
        value: json_schema
      # Only used when LLM_REPLAY_FALLBACK=live.
      - key: LLM_API_KEY
        sync: false
      - key: FUNDING_TIMEOUT_MINUTES
        value: "30"
      - key: SWEEPER_INTERVAL_MS
        value: "5000"

  - type: web
    name: paylock-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    # -w keeps cwd at apps/web, where the deliverables route resolves ../../fixtures.
    startCommand: npm run start -w apps/web
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Read at build time: next.config rewrites /api/* to this origin (decision J).
      - key: API_URL
        value: https://paylock-api.onrender.com
