services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paylock
      POSTGRES_PASSWORD: paylock # local development only
      POSTGRES_DB: paylock
    ports:
      - "5432:5432"
    volumes:
      - paylock-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylock -d paylock"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  paylock-pg:
